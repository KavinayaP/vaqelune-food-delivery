<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAQELUNE - Show Restaurants</title>
</head>
<body>

    <h2>All Restaurants</h2>

    {% if restaurantList %}
        <table border="1">
            <thead>
                <tr>
                    <th>Restaurant Name</th>
                    <th>Picture</th>
                    <th>Cuisine</th>
                    <th>Rating</th>
                    <th>Operations</th>
                </tr>
            </thead>

            <tbody>
                {% for r in restaurantList %}
                    <tr>
                        <td>{{ r.name }}</td>

                        <td>
                            <img src="{{ r.picture }}"
                                 alt="{{ r.name }}"
                                 width="120"
                                 height="100">
                        </td>

                        <td>{{ r.cuisine }}</td>

                        <td>{{ r.rating }}/5</td>

                        <td>
                            <a href="{% url 'open_update_restaurant' r.id %}">
                                Update Restaurant Info
                            </a>
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    {% else %}
        <p>No restaurants added yet.</p>
    {% endif %}

    <br><br>

    <a href="{% url 'open_add_restaurant' %}">
        Add New Restaurant
    </a>

    <br><br>

    <a href="{% url 'index' %}">
        Back to Home
    </a>

</body>
</html>
